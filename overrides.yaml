skills:
  # ─── base: Matt Pocock upstream mirror (engineering + productivity) ──────
  # plugins/base mirrors mattpocock/skills' engineering and productivity
  # buckets verbatim: zero patches, zero local forks. Decision record:
  # docs/adr/0009-base-matt-upstream-mirror.md

  ask-matt:
    source: { repo: mattpocock/skills, path: skills/engineering/ask-matt, ref: main }
    plugin: base
    patches: []

  code-review:
    source: { repo: mattpocock/skills, path: skills/engineering/code-review, ref: main }
    plugin: base
    patches: []

  codebase-design:
    source: { repo: mattpocock/skills, path: skills/engineering/codebase-design, ref: main }
    plugin: base
    patches: []

  diagnosing-bugs:
    source: { repo: mattpocock/skills, path: skills/engineering/diagnosing-bugs, ref: main }
    plugin: base
    patches: []

  domain-modeling:
    source: { repo: mattpocock/skills, path: skills/engineering/domain-modeling, ref: main }
    plugin: base
    patches: []

  grill-with-docs:
    source: { repo: mattpocock/skills, path: skills/engineering/grill-with-docs, ref: main }
    plugin: base
    patches: []

  implement:
    source: { repo: mattpocock/skills, path: skills/engineering/implement, ref: main }
    plugin: base
    patches: []

  improve-codebase-architecture:
