skills:
  # ─── base: Matt Pocock upstream-synced Skills ─────────────────────────────

  diagnosing-bugs:
    source: { repo: mattpocock/skills, path: skills/engineering/diagnosing-bugs, ref: main }
    plugin: base
    patches:
      - type: replace
        pattern: "When exploring the codebase, read `CONTEXT.md` (if it exists) to get a clear mental model of the relevant modules, and check ADRs in the area you're touching."
        with: "When exploring the codebase, read whatever domain, architecture, or decision documents the project already keeps (if any) to get a clear mental model of the relevant modules and the decisions already made in the area you're touching."
      - type: replace
        pattern: "hidden coupling) hand off to the `/improve-codebase-architecture` skill with the specifics."
        with: "hidden coupling), record the specific architectural follow-up yourself in this session — name the files and seams involved, the change you would make, and why the bug was able to hide there."

  prototype:
    source: { repo: mattpocock/skills, path: skills/engineering/prototype, ref: main }
    plugin: base
    patches: []

  # `grill-me` is the local run name for the upstream `productivity/grilling`
  # Skill. The upstream `productivity/grill-me` wrapper only forwarded to
  # `/grilling`, so it is not synced; the interview protocol itself is.
  grill-me:
    source: { repo: mattpocock/skills, path: skills/productivity/grilling, ref: main }
    plugin: base
    patches:
      - { type: set_frontmatter, field: name, value: grill-me }
      - type: set_frontmatter
        field: description
        value: "Grill the user relentlessly about a plan, decision, or idea. Use when the user asks to be grilled, wants their thinking stress-tested, or uses any 'grill' trigger phrase."
    target_patches:
      - target: agents/openai.yaml
        patches:
          - { type: replace_all, pattern: "\"Grilling\"", with: "\"Grill Me\"" }

  handoff:
    source: { repo: mattpocock/skills, path: skills/productivity/handoff, ref: main }
    plugin: base
    patches: []

  teach:
    source: { repo: mattpocock/skills, path: skills/productivity/teach, ref: main }
    plugin: base
    patches: []

  writing-great-skills:
    source: { repo: mattpocock/skills, path: skills/productivity/writing-great-skills, ref: main }
    plugin: base
    patches: []

  # ─── base: locally owned Skills ───────────────────────────────────────────

  # Forked from mattpocock/skills and maintained locally: the upstream version
  # delegates to `/codebase-design`, `/grilling`, and `/domain-modeling`, which
  # this repository no longer publishes. `ownership: local` keeps the sync job
  # from overwriting the fork while inventory and layout checks still apply.
  improve-codebase-architecture:
    ownership: local
    plugin: base
    provenance:
      repo: mattpocock/skills
      path: skills/engineering/improve-codebase-architecture
      ref: main
      forked_at_sha: 2ab958093e83e0ec752e6c1c5932da465bf23e0c
      forked_at: 2026-08-04
      license: upstream Skill text retained under its original mattpocock/skills license

  # ─── plus: engineering, thinking, tools, and writing ───────────────────────

  bro:
    source: { repo: dmmulroy/.dotfiles, path: home/.agents/skills/bro, ref: main }
    plugin: plus
    patches: []

  improve:
    source: { repo: shadcn/improve, path: skills/improve, ref: main }
    plugin: plus
    patches: []

  nuclear-review:
    source: { repo: cursor/plugins, path: cursor-team-kit/skills/thermo-nuclear-code-quality-review, ref: main }
    plugin: plus
    patches:
      - { type: set_frontmatter, field: name, value: nuclear-review }
      - type: set_frontmatter
        field: description
        value: Run an extremely strict maintainability review for abstraction quality, giant files, and spaghetti-condition growth. Use for a nuclear review, deep code quality audit, or especially harsh maintainability review.
      - { type: replace_all, pattern: "Thermo-Nuclear Code Quality Review", with: "Nuclear Review" }
    extra_mappings:
      - from: cursor-team-kit/agents/thermo-nuclear-code-quality-review.md
        to: plugins/plus/agents/nuclear-review.md
        patches:
          - { type: set_frontmatter, field: name, value: nuclear-review }
          - type: set_frontmatter
            field: description
            value: Nuclear code quality audit for maintainability, structure, giant files, spaghetti growth, and code-judo opportunities. Invoked via Task after a parent gathers diff and file contents. Loads the rubric from the nuclear-review Skill in the plus plugin.
          - { type: replace_all, pattern: thermo-nuclear-code-quality-review, with: nuclear-review }
          - { type: replace_all, pattern: "Thermo-Nuclear Code Quality Review", with: "Nuclear Review" }
          - { type: replace_all, pattern: "cursor-team-kit plugin", with: "plus plugin" }

  razor:
    source: { repo: hylarucoder/hai-stack, path: skills/hai-razor, ref: main }
    plugin: plus
    patches:
      - { type: set_frontmatter, field: name, value: razor }
      - type: replace
        pattern: "For Chinese readers, see `SKILL.zh_CN.md`. The English `SKILL.md` is the execution source of truth.\n\n"
        with: ""
      - { type: replace_all, pattern: hai-razor, with: razor }
      - type: replace
        pattern: "- The question is whether the whole idea is worth doing at all — use `hai-idea`.\n"
        with: ""
      - type: replace_all
        pattern: "`hai-prd`"
        with: "an installed product-specification Skill whose description clearly matches the task"
      - type: replace_all
        pattern: "`hai-architecture`"
        with: "an installed architecture Skill whose description clearly matches the task"
      - type: replace_all
        pattern: "`hai-goal`"
        with: "an installed execution-planning Skill whose description clearly matches the task"
      - type: append_content
        text: |
          ## Routing Compatibility

          Invoke another Skill only when an installed Skill's description clearly matches the next subtask. Otherwise, complete the subtask directly with this workflow. Never require an uninstalled Skill.
    target_patches:
      - target: agents/openai.yaml
        patches:
          - { type: replace_all, pattern: "$hai-razor", with: "$razor" }
      - target: references/output-template.md
        patches:
          - { type: replace_all, pattern: hai-razor, with: razor }
          - type: replace_all
            pattern: "`hai-goal`"
            with: "an installed execution-planning Skill whose description clearly matches the task"
          - type: replace_all
            pattern: " (For a Chinese-led run, see `SKILL.zh_CN.md`.)"
            with: ""
    exclude_files:
      - SKILL.zh_CN.md
  read:
    source: { repo: tw93/Waza, path: skills/read, ref: main }
    plugin: plus
    patches: []
    exclude_files:
      - scripts/check-update.sh

  # ─── plus: single upstream PUA Skill ───────────────────────────────────────

  pua:
    source: { repo: tanweai/pua, path: skills/pua, ref: main }
    plugin: plus
    patches:
      - type: replace
        pattern: "**⚠️ 味道检测（第一优先级）**：加载本 skill 后，先检查 SessionStart 是否已注入 `[PUA Always-On]` 和 `Current Flavor`。如果已注入，**以注入的味道为准**（用户在 `~/.pua/config.json` 配置的）。如果没有注入，默认 🟠 阿里味。"
        with: "**⚠️ 味道检测（第一优先级）**：加载本 Skill 后，主动读取 `~/.pua/config.json`（如果存在）的 `flavor` 配置；没有配置时默认使用 🟠 阿里味。不要假定 SessionStart hook 已运行。"
      - type: replace
        pattern: "**失败计数持久化**：失败次数在 context compaction 时由 PreCompact hook 自动保存到 `~/.pua/builder-journal.md`，SessionStart hook 自动恢复。详见 `pua:pro` skill 的 Compaction 状态保护章节。"
        with: "**失败计数持久化**：压缩或交接前，由当前 Agent 主动把失败次数和有效方法写入 `~/.pua/builder-journal.md`；下次加载本 Skill 时主动检查并恢复。宿主若提供等价 hook，只在有运行证据时依赖它。"
      - type: replace
        pattern: "每次标记时静默上报 `pua_triggered` 事件（详见 `references/platform.md`）。"
        with: "`[PUA生效 🔥]` 只写入当前输出；本发行版不附带遥测脚本，也不向外部服务静默上报。"
      - { type: replace_all, pattern: "**/pua-skills/skills/pua/SKILL.md", with: "**/plus/skills/pua/SKILL.md" }
      - type: replace
        pattern: "注意：不要用 Skill tool 加载 pua 或 pua:pua——会触发 router 循环。直接 Read SKILL.md。"
        with: "注意：子 Agent 直接 Read `pua/SKILL.md`；不要递归调用 `pua` Skill。"
      - type: replace
        pattern: "完整文化 DNA、黑话词库、扩展旁白变体详见 `references/flavors.md`，用 `/pua:flavor` 切换。钉内/钉外味还要读取 `references/methodology-ding.md` 和 `references/ding-reminders.md`。"
        with: "完整文化 DNA、黑话词库、扩展旁白变体详见 `references/flavors.md`。用户直接说出目标味道即可切换；钉内/钉外味还要读取 `references/methodology-ding.md` 和 `references/ding-reminders.md`。"
      - type: replace
        pattern: "失败次数决定压力等级 + 强制动作。**旁白使用当前活跃味道的语气**（由 SessionStart 注入或方法论路由决定），不硬编码阿里味。PostToolUse hook 会自动检测 Bash 失败并注入对应味道的压力旁白。"
        with: "失败次数决定压力等级 + 强制动作。**旁白使用当前活跃味道的语气**（由本 Skill 的配置读取或方法论路由决定），不硬编码阿里味。当前 Agent 根据实际工具结果自行更新失败计数和压力旁白。"
      - type: replace
        pattern: "收到 PostToolUse hook 注入的 `[PUA 突破 ✨]` 时（连续失败 ≥3 次后成功），必须执行："
        with: "连续失败 ≥3 次后首次成功时，标记 `[PUA 突破 ✨]` 并执行："
      - { type: replace, pattern: "2. **味道认可** — 用当前味道的认可话术（hook 已注入，跟随其语气）", with: "2. **味道认可** — 用当前味道的认可话术确认突破" }
      - type: replace
        pattern: "PostToolUse hook 会分析最近 3 次错误签名并分类注入，你收到后应区别对待："
        with: "当前 Agent 分析最近 3 次工具失败的错误签名并分类处理："
      - type: replace
        pattern: "8. **味道持久化**：`~/.pua/config.json` 中的 `\"flavor\"` 字段在新会话中通过 SessionStart hook 自动加载。`/pua flavor` 切换后会自动写入 config。自动路由选择的味道只在当前会话生效，不覆盖用户手动设置"
        with: "8. **味道持久化**：加载本 Skill 时主动读取 `~/.pua/config.json` 中的 `\"flavor\"` 字段；用户直接要求切换味道后更新该字段。自动路由只在当前会话生效，不覆盖用户手动设置"
      - type: replace
        pattern: "- **Claude Code 映射**：Skill 提供方法论；slash command 提供显式入口；hook 提供确定性 gate；subagent 提供上下文隔离但不是天然可信 verifier；PUA Loop Stop hook 承担 Oracle 式外部验证。"
        with: "- **Skills-only 映射**：本 Skill 提供方法论；subagent 只提供上下文隔离，不是天然可信 verifier。本发行版不附带 hook 或 Oracle，最终验证依赖实际命令输出、外部 CI/verifier 或用户验收。"
      - type: replace
        pattern: "- **四代理拓扑**：复杂/高风险任务不要单线程自证，按 `pua-policy-guardian → pua-action-executor → pua-self-reviewer → pua-verifier → 外部 hook/human` 串联；四个 agent 只能拥有对应权力，不允许互相代位。"
        with: "- **职责分离**：复杂或高风险任务不要由同一执行者单线程自证；按策略约束、执行、自审、独立验证分离职责，最终由真实 verifier、CI 或用户验收。"
      - type: replace
        pattern: "详细协议：遇到 eval、agent harness、长期任务、测试/评分资产、memory/status、发布链路时，加载 `skills/pua/references/harness-governance.md`。"
        with: "遇到 eval、agent harness、长期任务、测试/评分资产、memory/status 或发布链路时，直接执行上述权责分离和防作弊规则。"
      - type: replace
        pattern: |-
          ## 搭配使用

          - `/pua:pro` — 自进化基线 + /pua 指令系统 + Compaction 保护
          - `/pua:p9` — P9 Tech Lead 管理模式
          - `/pua:p7` — P7 骨干执行模式
          - `/pua:p10` — P10 CTO 战略模式
          - `superpowers:systematic-debugging` — 方法论层
          - `superpowers:verification-before-completion` — 防虚假完成
        with: |-
          ## 单 Skill 边界

          本发行版只发布一个 `pua` Skill，不附带 sibling Skills、commands、hooks、scripts 或 PUA plugin-level Agents。

          - 用户通过自然语言选择味道或工作模式，不调用任何 PUA 子命令。
          - 当前 Agent 显式完成失败计数、状态记录、验证和收尾；只有宿主提供且有运行证据时才依赖自动 hook。
          - 不声称外部 Oracle、Stop gate、session restore、遥测或资源清理已经运行，除非有直接证据。
    target_patches:
      - target: references/flavors.md
        patches:
          - { type: replace_all, pattern: "用户使用 `/pua:flavor` 切换", with: "用户直接要求切换味道" }
      - target: references/methodology-router.md
        patches:
          - { type: replace_all, pattern: "用户手动 `/pua flavor` 或设置 config.json", with: "用户直接指定味道或设置 config.json" }
    exclude_files:
      - references/agent-team.md
      - references/evolution-protocol.md
      - references/harness-governance.md
      - references/p10-protocol.md
      - references/p7-protocol.md
      - references/p9-protocol.md
      - references/platform.md
      - references/survey.md
      - references/teardown-protocol.md

  i-have-adhd:
    source: { repo: ayghri/i-have-adhd, path: skills/i-have-adhd, ref: main }
    plugin: plus
    patches: []

  humanizer-zh:
    source: { repo: op7418/Humanizer-zh, path: ., ref: main }
    plugin: plus
    patches: []
    exclude_files:
      - .gitignore
      - README.md

  archify:
    source: { repo: tt-a1i/archify, path: archify, ref: main }
    plugin: plus
    patches:
      - type: set_frontmatter
        field: description
        value: Create professional architecture, workflow, sequence, data-flow, and lifecycle/state diagrams as explorable standalone HTML with SVG, pan/zoom, search, semantic relationship inspection, presentation mode, dark/light themes, optional motion, and PNG/JPEG/WebP/SVG/WebM export. Accepts plain-language descriptions or Mermaid flowchart, sequenceDiagram, and stateDiagram input, then lays diagrams out in Archify style. Use when the user asks for system or cloud architecture, infrastructure and network topology, security boundaries, technical or approval workflows, runbooks, CI/CD flows, API call sequences, request lifecycles, data pipelines, ETL/ELT, PII boundaries, data lineage, state machines, lifecycle/status transitions, or conversion/beautification of Mermaid diagrams.
    target_patches:
      - target: package.json
        patches:
          - type: replace_all
            pattern: "    \"test:webm\": \"node test/webm-artifact.smoke.mjs\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"test\": \"npm run check:validators && npm run check:release-identity && node test/golden.mjs && node ../scripts/run-tests.mjs\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"check:release-identity\": \"node ../scripts/check-release-identity.mjs\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"build:gallery\": \"node ../scripts/build-gallery.mjs ../docs\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"build:guide\": \"node ../scripts/build-guide.mjs ../docs/guide.html\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"build:start\": \"node ../scripts/build-start.mjs ../docs/start.html\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"build:readme-showcase\": \"node ../scripts/build-readme-showcase.mjs\",\n"
            with: ""
          - type: replace_all
            pattern: "    \"check:validators\": \"node scripts/generate-validators.mjs --check\",\n    \"render:examples\": \"node scripts/render-examples.mjs ../examples\"\n"
            with: "    \"check:validators\": \"node scripts/generate-validators.mjs --check\"\n"
      - target: schemas/README.md
        patches:
          - { type: replace_all, pattern: "`npm test`", with: "`npm run check:validators`" }
    exclude_files:
      - examples/dataflow-product-analytics.html
      - examples/lifecycle-agent-run.html
      - examples/sequence-cache-miss-request.html
      - examples/web-app-rendered.html
      - examples/workflow-agent-tool-call-rendered.html
      - test/
