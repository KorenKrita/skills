  # ─── plus: engineering, thinking, tools, and writing ───────────────────────

  # dmmulroy's original plain-language restatement Skill, kept verbatim.
  # The wait-what context-aware re-pitch behavior moved back to base's
  # official wait-what when base became the full Matt mirror (ADR-0009).
  razor:
    source: { repo: hylarucoder/hai-stack, path: skills/hai-razor, ref: main }
    plugin: plus
    patches:
      - { type: set_frontmatter, field: name, value: razor }
      # Upstream 9b1f8c8 shortened the description and embedded hai-prd/hai-architecture routes in it;
      # keep the fuller trigger-rich description locally.
      - type: set_frontmatter
        field: description
        value: 'Audits whether each requirement, workflow step, role, field, state, module, layer, abstraction, or rule deserves to exist and returns a razor verdict: a Keep/Merge/Defer/Delete/Replace/Prove-first classification of every concept, the strongest survival argument for anything cut, and a concrete cut/proof list. Use whenever the user wants to apply Occam''s razor, simplify or trim a PRD / architecture / workflow / data model / state machine, challenge whether something is necessary, or spot fake requirements, premature abstractions, or over-engineering — even if they never say "razor." Trigger on 用奥卡姆剃刀, 剃刀一下, 砍需求, 砍掉没用的东西, 收一收复杂度, 这个字段/状态/模块/分层有必要吗, 这个抽象是不是多余, 是不是伪需求, 是不是过度设计, 这步能不能去掉, 这些角色/状态是不是太多了, and English like "is this over-engineered", "do we really need this layer", "this feels bloated, what can we delete", "too many fields".'
      - type: replace
        pattern: "For Chinese readers, see `SKILL.zh_CN.md`. The English `SKILL.md` is the execution source of truth.\n\n"
        with: ""
      - type: replace
        pattern: "If the user explicitly asks\n   for HTML or a visual report, hand the completed judgment to `hai-visual-explainer`; do not duplicate\n   its rendering workflow here."
        with: "If the user explicitly asks\n   for HTML or a visual report, hand the completed judgment to an installed visual-report Skill whose\n   description clearly matches the task, or render it directly; do not duplicate that workflow here."
      - type: replace
        pattern: "HTML remains opt-in and belongs to `hai-visual-explainer`."
        with: "HTML remains opt-in."
      - type: replace
        pattern: "- The question is whether the whole idea is worth doing at all — use `hai-idea`.\n"
        with: ""
      - type: replace_all
        pattern: "`hai-prd`"
        with: "an installed product-specification Skill whose description clearly matches the task"
      - type: replace_all
        pattern: "`hai-architecture`"
        with: "an installed architecture Skill whose description clearly matches the task"
      - type: replace_all
        pattern: "`hai-goal`"
        with: "an installed execution-planning Skill whose description clearly matches the task"
      - type: append_content
        text: |
          ## Routing Compatibility

          Invoke another Skill only when an installed Skill's description clearly matches the next subtask. Otherwise, complete the subtask directly with this workflow. Never require an uninstalled Skill.
    target_patches:
      - target: agents/openai.yaml
        patches:
          - { type: replace_all, pattern: "$hai-razor", with: "$razor" }
      - target: references/output-template.md
        patches:
          - type: replace_all
            pattern: "- **Path**: `<path returned by hai-visual-explainer>`"
            with: "- **Path**: `<path returned by the installed visual-report Skill, or /tmp/razor-<slug>/index.html when rendered directly>`"
          - type: replace_all
            pattern: "`hai-goal`"
            with: "an installed execution-planning Skill whose description clearly matches the task"
          - type: replace_all
            pattern: " (For a Chinese-led run, see `SKILL.zh_CN.md`.)"
            with: ""
    exclude_files:
      - SKILL.zh_CN.md
  # Upstream packages only SKILL.md; LICENSE is retained locally from the repository root.
  i-have-adhd:
    source: { repo: ayghri/i-have-adhd, path: skills/i-have-adhd, ref: main }
    plugin: plus
    patches:
      - { type: remove_frontmatter, field: disable-model-invocation }
      - type: set_frontmatter
        field: description
        value: 'Shape output for a reader with ADHD: lead with the next action, number multi-step work, restate state across turns, suppress tangents, give specific time estimates, and make wins visible. Use when the user says they have ADHD, asks for ADHD-friendly formatting, or wants this mode enabled; it stays on until they say "stop adhd mode".'

  # Vendored cybersecurity router (zhaoxuya520/reverse-skill). The entire
  # upstream tree ships under sec-router/vendor/ with SKILL.md renamed to
  # MOD.md (Pi discovers nested SKILL.md recursively); the top-level SKILL.md
  # is a thin routing entry owned by this repository. Updates run
  # sec-router/update-vendor.sh; provenance and deviations in sec-router/VENDOR.md.
  sec-router:
    ownership: local
    plugin: plus
    provenance:
      repo: zhaoxuya520/reverse-skill
      path: .
      ref: main
      forked_at_sha: 71acc8e3115f76bad7a914c36466c1086232288c
      forked_at: 2026-08-31
      license: MIT; upstream tree retained under sec-router/vendor/ with upstream LICENSE
